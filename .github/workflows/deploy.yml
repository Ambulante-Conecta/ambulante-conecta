# Publica a pasta frontend no GitHub Pages a cada push na main.
# A API (backend-ambulante) é publicada pelo próprio Render, que acompanha a mesma branch.
name: Publicar front-end no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # permite publicar de novo pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o anterior
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Pages
        uses: actions/configure-pages@v4

      - name: Empacotar a pasta frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
