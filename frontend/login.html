<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar — Ambulante Conecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317624A'/%3E%3Cg transform='translate%284 4%29' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9 4.5 4h15L21 9'/%3E%3Cpath d='M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z'/%3E%3Cpath d='M5 13.5V21h14v-7.5'/%3E%3Cpath d='M10 21v-5h4v5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="card login-card" id="conteudo">
    <a class="brand brand-login" href="index.html" aria-label="Ambulante Conecta, página inicial">
      <span class="marca-icone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9 4.5 4h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M5 13.5V21h14v-7.5"/><path d="M10 21v-5h4v5"/></svg></span><span class="marca-nome">Ambulante <strong>Conecta</strong></span>
    </a>
    <h1>Entrar</h1>
    <p class="muted">Use o CPF e a senha do seu cadastro.</p>
    <p class="help" id="avisoSessao" hidden>Sua sessão expirou. Entre novamente para continuar.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="cpf">CPF</label>
        <input id="cpf" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <div class="senha-wrap">
          <input id="senha" name="senha" type="password" autocomplete="current-password" maxlength="128">
          <button type="button" class="btn btn-ghost btn-sm" id="verSenha" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <p class="msg-erro" id="erroLogin" role="alert"></p>
      <button class="btn btn-primary btn-bloco" type="submit" id="entrar">Entrar</button>
    </form>

    <p class="login-rodape">Ainda não tem conta? <a href="cadastro.html">Faça seu cadastro</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
