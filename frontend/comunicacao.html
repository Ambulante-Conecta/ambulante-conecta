<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunicação — Ambulante Conecta</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body data-pagina="comunicacao" data-exige-login="ambulante">
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Ambulante Conecta, página inicial">
        <img class="logo" src="img/logo.png" alt="Ambulante Conecta">
      </a>
      <nav class="nav" aria-label="Principal" id="nav"></nav>
      <p class="sidebar-footer">Seus dados pessoais são tratados conforme a LGPD.</p>
    </aside>
    <div class="main">
      <header class="topbar">
        <img class="topbar-logo" src="img/logo.png" alt="Ambulante Conecta">
        <h1 class="topbar-title">Comunicação</h1>
      </header>
      <main class="content" id="conteudo">

        <div class="section-title page-head"><div><h2>Mensagens</h2><p class="muted">Converse com a prefeitura e receba os avisos sobre os seus pedidos.</p></div><button class="btn btn-primary" id="btnNova" type="button" aria-expanded="false" aria-controls="formMsgCard">Nova mensagem</button></div>

        <div class="card form-card" id="formMsgCard" hidden>
          <h3>Nova mensagem</h3>
          <p class="muted-note">Para: Prefeitura de Manaus</p>
          <form id="formMsg" novalidate>
            <div class="field mt">
              <label for="assunto">Assunto *</label>
              <input id="assunto" name="assunto" maxlength="120" aria-describedby="erro-assunto">
              <small class="msg-erro" id="erro-assunto" role="alert"></small>
            </div>
            <div class="field">
              <label for="texto">Mensagem *</label>
              <textarea id="texto" name="texto" rows="4" maxlength="1000" aria-describedby="dica-texto erro-texto"></textarea>
              <small class="muted-note" id="dica-texto">Até 1000 caracteres.</small>
              <small class="msg-erro" id="erro-texto" role="alert"></small>
            </div>
            <div class="form-actions"><button class="btn btn-ghost" type="button" id="cancelaMsg">Cancelar</button><button class="btn btn-primary" type="submit" id="btnEnviar">Enviar mensagem</button></div>
          </form>
        </div>

        <div id="caixa" aria-live="polite">
          <p class="vazio">Carregando suas mensagens...</p>
        </div>

        <div id="listas" hidden>
          <section class="mt" aria-labelledby="t-rec"><h3 id="t-rec">Recebidas</h3><div class="msg-list" id="recebidas"></div></section>
          <section class="mt" aria-labelledby="t-env"><h3 id="t-env">Enviadas</h3><div class="msg-list" id="enviadas"></div></section>
        </div>
      </main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Principal (celular)" id="mobileNav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/comunicacao.js"></script>
</body>
</html>
