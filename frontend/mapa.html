<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pontos de venda — Ambulante Conecta</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/icone-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="mapa">
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Ambulante Conecta, página inicial">
        <span class="marca-icone"><img src="img/icone-192.png" alt="" width="32" height="32"></span><span class="marca-nome">Ambulante <strong>Conecta</strong></span>
      </a>
      <nav class="nav" aria-label="Principal" id="nav"></nav>
      <p class="sidebar-footer">Seus dados pessoais são tratados conforme a LGPD.</p>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="topbar-marca" href="index.html" aria-label="Ambulante Conecta, página inicial"><span class="marca-icone"><img src="img/icone-192.png" alt="" width="32" height="32"></span><span class="marca-nome">Ambulante <strong>Conecta</strong></span></a>
        <h1 class="topbar-title">Pontos de venda</h1>
      </header>
      <main class="content" id="conteudo">
        <div class="page-head">
          <h2>Pontos de venda</h2>
          <p>Veja onde estão os pontos livres e peça o que combina com você.</p>
        </div>

        <div class="mapa-layout mt">
          <div class="card map-card mapa-coluna-mapa">
            <!-- Leaflet + OpenStreetMap, montado por js/mapa.js -->
            <div class="map-slot map-slot-grande" id="map" role="region" aria-label="Mapa de pontos de venda. A mesma informação está na lista de pontos."></div>
          </div>

          <section class="mapa-coluna-lista" aria-labelledby="t-lista">
            <div class="mapa-lista-topo">
              <h2 class="inicio-titulo" id="t-lista">Lista de pontos</h2>
              <fieldset class="filtro-mapa" id="filtroStatus">
                <legend class="sr-only">Mostrar</legend>
                <div class="choices choices-compactas">
                  <label><input type="radio" name="status" value="todos" checked> Todos</label>
                  <label><input type="radio" name="status" value="disponivel"> Livres</label>
                  <label><input type="radio" name="status" value="ocupado"> Ocupados</label>
                </div>
              </fieldset>
            </div>
            <ul class="pontos-lista" id="listaPontos" aria-live="polite"></ul>
          </section>
        </div>
      </main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Principal (celular)" id="mobileNav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/mapa.js"></script>
</body>
</html>
